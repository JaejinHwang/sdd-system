# ============================================================
# Tech Stack Preset: Custom Template
# 새로운 기술 스택 프리셋을 만들 때 사용
# ============================================================
# 사용법: 이 파일을 복사하여 your-stack-name.yaml로 저장
# ============================================================

preset:
  name: "{{preset_name}}"
  description: "{{preset_description}}"
  version: "1.0.0"
  
  suitable_for:
    - "{{project_type_1}}"
    - "{{project_type_2}}"

stack:
  frontend:
    framework: "{{framework}}"
    version: "{{version}}"
    language: "{{TypeScript|JavaScript}}"
    styling: "{{styling_solution}}"
    ui_components: "{{component_library}}"
    state_management: "{{state_lib}}"
    
  backend:
    runtime: "{{runtime}}"
    api_style: "{{REST|GraphQL|tRPC}}"
    validation: "{{validation_lib}}"
    
  database:
    provider: "{{provider}}"
    type: "{{PostgreSQL|MySQL|MongoDB|SQLite}}"
    orm: "{{orm_or_client}}"
    
  auth:
    provider: "{{auth_provider}}"
    methods:
      - "{{method_1}}"
      
  ai:
    provider: "{{Anthropic|OpenAI|Google|None}}"
    model: "{{model_name}}"
    sdk: "{{sdk_package}}"
    
  infrastructure:
    hosting: "{{hosting_provider}}"
    storage: "{{storage_solution}}"
    
  dev_tools:
    package_manager: "{{pnpm|npm|yarn}}"
    linter: "{{linter}}"
    formatter: "{{formatter}}"
    testing: "{{testing_framework}}"

directory_structure:
  src:
    # 프로젝트에 맞게 구조 정의
    app: []
    components: []
    lib: []
  specs:
    - "01-discovery/"
    - "02-specification/"
    - "03-implementation/"
  tests: []

dependencies:
  production:
    "{{package_name}}": "{{version}}"
    
  development:
    "{{package_name}}": "{{version}}"

architecture_diagram: |
  flowchart TB
    Client[Client]
    Server[Server]
    DB[(Database)]
    
    Client --> Server
    Server --> DB

env_template:
  "{{ENV_VAR_NAME}}": "{{description}}"

default_adrs: []