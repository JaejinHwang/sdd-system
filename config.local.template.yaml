# ============================================================
# SDD System Local Configuration
# 개인 환경 설정 (이 파일은 Git에 커밋하지 마세요)
# ============================================================
# 사용법: 
# 1. 이 파일을 config.local.yaml로 복사
# 2. 개인 환경에 맞게 수정
# 3. .gitignore에 config.local.yaml 추가됨
# ============================================================

# 프로젝트 생성 위치 (개인 환경에 맞게 수정)
paths:
  projects_base: "~/my-projects"  # 원하는 경로로 변경

# API 키 설정
secrets:
  anthropic_api_key: "sk-ant-xxxxx"  # 실제 키로 교체
  
# Linear 연동 (사용하는 경우)
integrations:
  linear:
    enabled: true
    api_key: "lin_api_xxxxx"
    team_id: "TEAM_ID"
    
  notion:
    enabled: false
    api_key: ""
    database_id: ""

# 개인 선호 설정
preferences:
  # 기본 에디터
  editor: "code"  # code | cursor | vim
  
  # 스펙 생성 시 자동으로 에디터 열기
  auto_open_editor: true
  
  # 상세 로그 출력
  verbose: false